name: CI

on:
  push:
    branches: ['main', 'feat/huixiang-rebuild']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Browser audits
        if: matrix.node == 24
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm run audit:menu
          npm run audit:render
          node scripts/audit-server.mjs
          npm run audit:task-lifecycle
