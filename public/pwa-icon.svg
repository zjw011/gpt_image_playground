<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 绘想品牌标：紫蓝渐变圆角方块 + 白色「绘」。
       与前端 Logo（theme.tsx）同一套渐变，favicon、PWA 图标共用这一份。 -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cf6" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#brand)" />
  <!-- 不用 dominant-baseline：各渲染器对它的支持不一致，直接给基线 y 更稳 -->
  <text
    x="32"
    y="46"
    text-anchor="middle"
    font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif"
    font-size="36"
    font-weight="700"
    fill="#ffffff">绘</text>
</svg>
